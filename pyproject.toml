[project]
name = "deals"
version = "0.1.0"
description = "Crawl e-commerce categories, track price history, alert on real discounts"
requires-python = ">=3.12"
dependencies = [
    "curl_cffi>=0.16",
    "selectolax>=1.0",
    "playwright>=1.50",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
tools = ["datasette>=0.65"]  # live database browser on the server (make dbweb)

[project.scripts]
deals = "deals.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
