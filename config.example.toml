noon_eg = "category:home-and-kitchen/home-appliances-31235/large-appliances/heating-cooling-and-air-quality/air-conditioners"
jumia_eg = "category:air-conditioning"

[[watch]]
name = "Gaming consoles"
label = "أجهزة ألعاب (بلايستيشن، إكس بوكس، سويتش)"
interval_minutes = 10   # top priority
min_price = 8000        # consoles and bundles; games and controllers are cheaper
# amazon.eg: the platform nodes (PlayStation 5 21868828031, Xbox Series 21868824031...) mix
# consoles with games and accessories and the planner recurses into their Games children,
# so only console-only nodes and console searches are used.
amazon_eg = [
    "category:21868896031",   # Nintendo Switch > Consoles
    "category:206233788031",  # Nintendo Switch 2 > Consoles
    "category:92555823031",   # handheld game systems (Steam Deck, Switch Lite...)
    "search:playstation 5 console",
    "search:xbox series x console",
    "search:xbox series s console",
]
noon_eg = "category:electronics-and-mobiles/video-games-10181/gaming-console"
# Jumia: console-only categories plus searches (consoles are also filed under accessories)
jumia_eg = [
    "category:playstation-5-consoles",
    "category:playstation4-consoles",
    "category:nintendo-switch-consoles",
    "search:playstation 5",
    "search:xbox series",
    "search:nintendo switch",
]
# Searches and the console nodes still return pricey accessories (racing wheels, headsets, Pro
# controllers), so only titles that look like a console are recorded; "console" in the title always wins.
require_words = ["console", "playstation 5", "ps5", "playstation 4", "ps4", "xbox series", "xbox one",
                 "nintendo switch", "switch 2", "switch oled", "switch lite", "steam deck", "rog ally",
                 "legion go", "playstation portal"]
exclude_words = ["controller", "gamepad", "joystick", "headset", "wheel", "pedal", "case", "cover", "skin",
                 "stand", "dock", "cable", "charger", "charging", "bag", "grip", "mount", "sticker",
                 "protector", "thumb", "strap", "card", "game ", "edition game", "mouse", "keyboard",
                 "chair", "monitor", "camera", "microphone", "fan ", "cooling", "manette", "arcade",
                 "amplifier", "dac", "fight stick", "fightstick", "remote control", "for ps5", "for ps4",
                 "for xbox", "for nintendo", "for switch", "for steam deck", "for playstation", "pour ps",
                 "dualsense", "joy-con", "joy con", "pro controller", "portable ssd", "storage expansion",
                 "expansion card", "earbuds", "earphones", "speaker", "disc drive"]

