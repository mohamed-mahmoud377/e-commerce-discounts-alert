# deals coordinator configuration. Copy to config.toml (local) or /etc/deals/config.toml (server).

[server]
host = "127.0.0.1"      # "0.0.0.0" on the server so remote workers can connect
port = 8787
data_dir = "data"       # SQLite database, backups, cookies (relative to this file)
admin_token = ""        # secret for the web UI at /ui (generate with: deals token)

# One token per worker machine; the token is how the coordinator knows who is
# calling. Generate with:  deals token
[workers]
local = "change-me"
# droplet = "..."
# mac = "..."
# friend-ahmed = "..."

[telegram]
bot_token = ""          # from @BotFather
chat_id = ""            # run 'deals telegram' after sending your bot a message

[alerts]
min_drop = 0.30               # alert when >= 30% below the product's typical (90-day) price
atl_min_drop = 0.20           # ...or a new all-time low at least 20% below typical
atl_min_history_days = 14     # (only once we have 2 weeks of history)
price_error_drop = 0.60       # >= 60% below typical is flagged as a possible pricing error
min_history_days = 3          # with less history than this a product counts as "new"
early_min_history_days = 1    # from 1 day: a 30% drop below everything seen alerts early (low confidence)
max_share_at_or_below = 0.15  # no alert if the product was this cheap more than 15% of the time (recurring promos)
new_product_min_drop = 0.30   # new products: site-claimed discount needed (plus a scarcity/deal signal)
list_max_claimed_drop = 0.60  # a claim of 60%+ off an RRP ("list") price is rejected as fake
confirm_low_confidence = true # hold low-confidence alerts until the price is seen again on the next crawl
confirm_minutes = 90          # ...but send anyway after this long if the product was not rechecked
realert_after_days = 7        # don't repeat an alert for the same product within a week...
realert_extra_drop = 0.05     # ...unless the price drops another 5%

[schedule]
min_interval_minutes = 10     # fastest a slice is ever re-crawled (when its prices keep moving)
max_interval_factor = 3.0     # quiet slices back off to watch interval x 3
replan_days = 7               # re-split categories weekly (new sub-categories, shifting sizes)
lease_minutes = 5

# Politeness per site, per worker (seconds between requests)
[sites.amazon_eg]
min_delay = 2.0
max_delay = 4.0

[sites.noon_eg]
min_delay = 1.0
max_delay = 2.0

# ---------------------------------------------------------------------------
# What to track. Each [[watch]] is a product group with one root per site:
#   amazon_eg = "category:<browse node id>"
#   noon_eg   = "category:<category path>"
# (or "search:<keywords>"; a list of roots also works). Find ids with:
#   deals categories amazon_eg 18018102031
#   deals categories noon_eg electronics-and-mobiles
# label is the name shown in alerts (optional, defaults to name).
# min_price (EGP) skips cheap accessories/junk both when crawling and alerting.
# interval_minutes is the starting revisit interval; it adapts per slice.
# ---------------------------------------------------------------------------

[[watch]]
name = "TVs"
label = "تلفزيونات"
interval_minutes = 20
min_price = 3000
amazon_eg = "category:21832982031"
noon_eg = "category:electronics-and-mobiles/television-and-video/televisions"

[[watch]]
name = "Refrigerators"
label = "ثلاجات"
interval_minutes = 20
min_price = 5000
amazon_eg = "category:21863822031"
noon_eg = "category:home-and-kitchen/home-appliances-31235/large-appliances/refrigerators-and-freezers"

[[watch]]
name = "Air conditioners"
label = "تكييفات"
interval_minutes = 10   # top priority: stays between 10 and 30 min
min_price = 8000
amazon_eg = "category:21863915031"
noon_eg = "category:home-and-kitchen/home-appliances-31235/large-appliances/heating-cooling-and-air-quality/air-conditioners"

[[watch]]
name = "Gaming consoles"
label = "أجهزة ألعاب (بلايستيشن، إكس بوكس، سويتش)"
interval_minutes = 10   # top priority
min_price = 8000        # consoles and bundles; games and controllers are cheaper
# amazon.eg: the platform nodes (PlayStation 5 21868828031, Xbox Series 21868824031...) mix
# consoles with games and accessories and the planner recurses into their Games children,
# so only console-only nodes and console searches are used.
amazon_eg = [
    "category:21868896031",   # Nintendo Switch > Consoles
    "category:206233788031",  # Nintendo Switch 2 > Consoles
    "category:92555823031",   # handheld game systems (Steam Deck, Switch Lite...)
    "search:playstation 5 console",
    "search:xbox series x console",
    "search:xbox series s console",
]
noon_eg = "category:electronics-and-mobiles/video-games-10181/gaming-console"

